name: youyue
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopbooking
      POSTGRES_USER: shopbooking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopbooking -d shopbooking"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      BIND_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://db:5432/shopbooking
      DB_USER: shopbooking
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
volumes:
  pgdata:
