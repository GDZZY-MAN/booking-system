root /usr/share/nginx/html;
index index.html;
client_max_body_size 96k;
access_log off;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

# Docker DNS resolves the backend again after its container is replaced.
resolver 127.0.0.11 valid=5s ipv6=off;
set $booking_backend http://backend:8080;
location = /api/v1/owner/shop/branding {
    client_max_body_size 850k;
    include /etc/nginx/booking-api.conf;
}
location /api/ {
    include /etc/nginx/booking-api.conf;
}
location = /health {
    proxy_pass $booking_backend/actuator/health;
}
location /assets/ {
    try_files $uri =404;
    expires 7d;
}
location / {
    expires -1;
    try_files $uri $uri/ /index.html;
}
