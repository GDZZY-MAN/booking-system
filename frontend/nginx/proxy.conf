root /usr/share/nginx/html;
index index.html;
client_max_body_size 96k;
access_log off;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

# Docker DNS resolves the backend again after its container is replaced.
resolver 127.0.0.11 valid=5s ipv6=off;
set $booking_backend http://backend:8080;
location /api/ {
    proxy_pass $booking_backend;
    proxy_set_header Host $host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
location = /health {
    proxy_pass $booking_backend/actuator/health;
}
location /assets/ {
    try_files $uri =404;
    expires 7d;
}
location / {
    expires -1;
    try_files $uri $uri/ /index.html;
}
